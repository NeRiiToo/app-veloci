{% extends 'base.html' %}
{% load static %}
{% block title %}Logs do Sistema - Veloci{% endblock %}
{% block nav_logs %}active{% endblock %}

{% block extra_css %}
<link href="{% static 'css/logs.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<h1 class="mb-4">Logs do Sistema</h1>

<div class="filters card">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-12 col-sm-6 col-md-2">
                <div class="mb-3">
                    <label class="form-label">Nível</label>
                    <select class="form-select" id="nivelFilter">
                        <option value="todos">Todos</option>
                        <option value="INFO">Info</option>
                        <option value="ERROR">Erro</option>
                        <option value="WARNING">Aviso</option>
                    </select>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <div class="mb-3">
                    <label class="form-label">Usuário</label>
                    <select class="form-select select2" id="usuarioFilter">
                        <option value="">Todos os usuários</option>
                    </select>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <div class="mb-3">
                    <label class="form-label">Empresa</label>
                    <select class="form-select select2" id="empresaFilter">
                        <option value="">Todas as empresas</option>
                    </select>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-2">
                <div class="mb-3">
                    <label class="form-label">Data Inicial</label>
                    <input type="date" class="form-control" id="dataInicial">
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-2">
                <div class="mb-3">
                    <label class="form-label">Data Final</label>
                    <input type="date" class="form-control" id="dataFinal">
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-12 col-sm-6 d-grid gap-2 d-md-block">
                <button class="btn btn-primary me-md-2" onclick="carregarLogs()">Filtrar</button>
                <button class="btn btn-secondary" onclick="limparFiltros()">Limpar Filtros</button>
            </div>
        </div>
    </div>
</div>

<div class="log-container mt-4" id="logContainer"></div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/logs.js' %}"></script>
{% endblock %}
